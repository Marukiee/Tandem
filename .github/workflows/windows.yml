name: Windows app

# Builds the Windows app on every change to it and keeps the installer on the release "windows-preview", so it can be
# tried on a PC without waiting for a version. The installers of versions come from the release workflow.
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "crates/**"
      - "Cargo.lock"
      - "scripts/build-windows.ps1"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            windows/src-tauri -> target

      # The newest version in the changelog: a preview is a build on the way to the next one.
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c "import json;print(json.load(open('changelog.json'))[0]['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build the installer and the daemon
        shell: pwsh
        env:
          TANDEM_BUILD: preview-${{ github.run_number }}
        run: ./scripts/build-windows.ps1 -Version ${{ steps.v.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist-windows/*
          if-no-files-found: error

      # Installs the app on the runner, starts it and takes pictures of the screen, so what it looks like on Windows can
      # be checked without a Windows PC. The log of the app goes in the pictures' folder too. The runner may have no
      # screen to take a picture of; that is not a failure.
      - name: Start the app and take screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          function Shot($name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Force screenshots | Out-Null
            $bitmap.Save("screenshots/$name.png")
          }
          $log = Join-Path $env:LOCALAPPDATA "nl.markmaaktmedia.tandem\logs\tandem.log"
          # The app says in its log what it has done, which is how to know it is ready: a cold start of the web view can
          # take a long time on a new machine.
          function WaitFor($pattern, $seconds) {
            $until = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $until) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern $pattern -Quiet)) { return $true }
              Start-Sleep -Milliseconds 500
            }
            return $false
          }
          function ShowLog($title) {
            Write-Host "---- $title"
            Get-ChildItem (Split-Path $log) -Filter "*.log" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "-- $($_.Name)"
              Get-Content $_.FullName | Write-Host
              Copy-Item $_.FullName "screenshots/$title-$($_.Name)" -ErrorAction SilentlyContinue
            }
          }
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $setup = Get-ChildItem dist-windows -Filter "Tandem-Windows-x64-setup.exe"
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Include "Tandem.exe", "tandem-windows.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $env:LOCALAPPDATA -Directory | ForEach-Object { Write-Host $_.FullName }; throw "the installer put no Tandem.exe on the machine" }

          # What Tandem and the web views of Windows that it keeps alive hold, in megabytes. The point of putting windows away
          # is that this drops when nothing is on the screen.
          function Memory($label) {
            $mine = Get-Process -Name Tandem -ErrorAction SilentlyContinue
            $views = Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue
            $own = ($mine | Measure-Object -Property WorkingSet64 -Sum).Sum / 1MB
            $web = ($views | Measure-Object -Property WorkingSet64 -Sum).Sum / 1MB
            Write-Host ("memory {0}: Tandem {1:N0} MB, {2} web view processes {3:N0} MB, together {4:N0} MB" -f $label, $own, @($views).Count, $web, ($own + $web))
          }

          # The console of the runner is out of the way, so the window of the app is what is in the picture.
          (New-Object -ComObject Shell.Application).MinimizeAll()
          $env:TANDEM_PANEL_KEPT_SECONDS = "6"
          Write-Host "starting $($exe.FullName)"
          Start-Process $exe.FullName
          Write-Host "the engine is up: $(WaitFor 'the engine runs' 90)"
          Write-Host "the window is up: $(WaitFor 'the main window shows' 120)"
          Start-Sleep -Seconds 4
          Shot "app-main"
          Memory "window open"

          # Closing the window gives the web view back.
          (Get-Process -Name Tandem | Select-Object -First 1).CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 10
          Memory "window closed"

          # The panel from the corner: made when asked for, away again a few seconds after it was closed.
          Start-Process $exe.FullName -ArgumentList "--panel"
          Write-Host "the panel opened: $(WaitFor 'the panel opens' 90)"
          Start-Sleep -Seconds 3
          Shot "app-panel-second"
          Memory "panel open"
          Start-Process $exe.FullName -ArgumentList "--panel"
          Start-Sleep -Seconds 14
          Memory "panel closed and put away"
          ShowLog "main"
          Stop-Process -Name Tandem -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          # A start with --panel opens the small panel in the corner, where a click on the tray icon would put it.
          Remove-Item (Split-Path $log) -Recurse -Force -ErrorAction SilentlyContinue
          Start-Process $exe.FullName -ArgumentList "--panel"
          Write-Host "the panel opened: $(WaitFor 'the panel opens' 90)"
          Start-Sleep -Seconds 3
          Shot "app-panel"
          Start-Sleep -Seconds 4
          ShowLog "panel"
          Get-Process | Where-Object { $_.ProcessName -match "Tandem" } | Select-Object ProcessName, Id, Responding | Format-Table | Out-String | Write-Host

      # The pages with pretend data, drawn by the Edge on the runner: the same engine as the window of the app, with
      # the fonts and the font smoothing of Windows.
      - name: Screenshots of the pages with pretend data
        continue-on-error: true
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "windows/ui" -WindowStyle Hidden
          Start-Sleep -Seconds 2
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $out = (Resolve-Path screenshots).Path
          $edgeData = Join-Path $env:RUNNER_TEMP "edge-profile"
          $shots = @(
            @{ name = "ui-device"; url = "index.html?page=device"; size = "1040,820" },
            @{ name = "ui-shared"; url = "index.html?page=shared"; size = "1040,820" },
            @{ name = "ui-notifications"; url = "index.html?page=notifications"; size = "1040,820" },
            @{ name = "ui-settings"; url = "index.html?page=settings"; size = "1040,820" }
          )
          foreach ($shot in $shots) {
            $file = Join-Path $out "$($shot.name).png"
            # A profile of its own, so Edge starts as a new process instead of handing the page to one already running.
            $process = Start-Process $edge -PassThru -ArgumentList "--headless=new", "--disable-gpu", "--no-first-run", "--hide-scrollbars", "--user-data-dir=$edgeData", "--virtual-time-budget=8000", "--window-size=$($shot.size)", "--screenshot=$file", "http://127.0.0.1:8765/$($shot.url)"
            $process | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
            Write-Host "$($shot.name): $(Test-Path $file)"
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/*
          if-no-files-found: ignore

      - name: Publish the preview
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f windows-preview
          git push -f origin windows-preview
          title="Windows preview (experimental)"
          about="An experimental preview of Tandem for Windows, built from commit ${GITHUB_SHA::7}. It is not a version: the next build replaces it, and it is not offered as an update anywhere. It has not been tried on many PCs yet, so things can break."
          help="Windows may warn about an unknown publisher, because the installer is not signed yet: choose More info, then Run anyway. When the firewall asks, allow Tandem on private networks, or your phone cannot find this PC."
          notes=$(printf '%s\n\n%s' "$about" "$help")
          if gh release view windows-preview >/dev/null 2>&1; then
            gh release edit windows-preview --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create windows-preview --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          gh release upload windows-preview dist-windows/Tandem-Windows-x64-setup.exe dist-windows/Tandem-Windows-x64-setup.exe.sha256 dist-windows/tandemd-windows-x86_64.zip dist-windows/tandemd-windows-x86_64.zip.sha256 --clobber
