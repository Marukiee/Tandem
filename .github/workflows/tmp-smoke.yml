name: Tmp smoke
on:
  push:
    branches: [claude/funny-newton-2730df]
    paths: ["scripts/windows-smoke*", ".github/workflows/tmp-smoke.yml"]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Get the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42105129522 -n windows -D dist-windows
      - name: Try the app
        shell: pwsh
        run: pwsh scripts/windows-smoke.ps1 -Setup dist-windows/Tandem-Windows-x64-setup.exe -Daemon dist-windows/tandemd-windows-x86_64.zip -Out smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: smoke
