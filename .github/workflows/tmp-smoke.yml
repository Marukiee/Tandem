name: Tmp smoke
on:
  push:
    branches: [claude/funny-newton-2730df]
    paths: ["scripts/windows-smoke*", ".github/workflows/tmp-smoke.yml"]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Get the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42095350216 -n windows -D dist-windows
      - name: Look at the port
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Get-Item dist-windows/Tandem-Windows-x64-setup.exe
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $log = Join-Path $env:RUNNER_TEMP "inner.log"
          $inner = Join-Path $env:RUNNER_TEMP "inner.ps1"
          @"
          Start-Transcript -Path '$log'
          whoami /groups | Select-String 'Mandatory Label'
          `$env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          Start-Process '$env:LOCALAPPDATA\Tandem\Tandem.exe'
          Start-Sleep -Seconds 20
          Get-CimInstance Win32_Process -Filter "name='msedgewebview2.exe'" | Where-Object { `$_.CommandLine -match 'Tandem.exe' -and `$_.CommandLine -notmatch '--type=' } | ForEach-Object { `$_.CommandLine }
          try { (Invoke-WebRequest 'http://127.0.0.1:9222/json/list' -UseBasicParsing -TimeoutSec 5).Content } catch { "no answer: `$(`$_.Exception.Message)" }
          Stop-Transcript
          "@ | Set-Content $inner
          runas /trustlevel:0x20000 /env "powershell.exe -NoProfile -ExecutionPolicy Bypass -File $inner"
          Write-Host "runas said $LASTEXITCODE"
          Start-Sleep -Seconds 40
          Get-Content $log -ErrorAction SilentlyContinue | Write-Host
