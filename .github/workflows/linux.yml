name: Linux app

# Builds the Linux app (the same app as on Windows, with the interface shared) on every change to it and keeps the packages on
# the release "linux-preview", so it can be tried on a Linux desktop without waiting for a version. The packages of versions come
# from the release workflow.
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "crates/**"
      - "Cargo.lock"
      - "scripts/build-linux-app.sh"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

concurrency:
  group: linux-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Linux app
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            windows/src-tauri -> target

      - name: The web view and the other packages of the desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf build-essential curl wget file xdg-utils rpm nasm libasound2-dev

      # The player that the media controls of the desktop talk to, tried on a session bus of its own.
      - name: Test the media controls
        working-directory: windows/src-tauri
        run: |
          sudo apt-get install -y dbus-daemon dbus-user-session
          dbus-run-session -- cargo test -p tandem-winsys -- --nocapture

      # The newest version in the changelog: a preview is a build on the way to the next one.
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('changelog.json'))[0]['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build the packages
        env:
          TANDEM_BUILD: preview-${{ github.run_number }}
        run: ./scripts/build-linux-app.sh ${{ steps.v.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist-linux/*
          if-no-files-found: error

      - name: Publish the preview
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f linux-preview
          git push -f origin linux-preview
          title="Linux preview (experimental)"
          about="An experimental preview of Tandem for Linux, built from commit ${GITHUB_SHA::7}. It is not a version: the next build replaces it, and it is not offered as an update anywhere. It has not been tried on a real Linux desktop yet, so things can break."
          help="Install the .deb with your package manager, or make the AppImage executable and run it. The app lives in the system tray; some desktops need the AppIndicator extension to show it. Allow Tandem through the firewall on your local network, or your phone cannot find this computer."
          notes=$(printf '%s\n\n%s' "$about" "$help")
          if gh release view linux-preview >/dev/null 2>&1; then
            gh release edit linux-preview --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create linux-preview --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          gh release upload linux-preview dist-linux/Tandem-Linux-x64.deb dist-linux/Tandem-Linux-x64.deb.sha256 dist-linux/Tandem-Linux-x64.rpm dist-linux/Tandem-Linux-x64.rpm.sha256 dist-linux/Tandem-Linux-x64.AppImage dist-linux/Tandem-Linux-x64.AppImage.sha256 --clobber
