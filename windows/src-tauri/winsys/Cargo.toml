[package]
name = "tandem-winsys"
version = "0.1.0"
description = "The few parts of Windows that Tandem uses: the battery and the media controls of the system"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Marukiee/Tandem"
rust-version = "1.90"

# On any other system the crate compiles to nothing that does anything, so the app can be built and tested anywhere.
[target.'cfg(windows)'.dependencies]
log = "0.4"
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: the media controls of the desktop are a service on the session bus (MPRIS), which GNOME, KDE and the media keys of the
# keyboard talk to.
[target.'cfg(target_os = "linux")'.dependencies]
log = "0.4"
zbus = "5"
x11rb = "0.13"
# Wayland: the portals of the desktop (a window may not press keys or look at the screen there without asking). One question,
# remembered, and then the input and the screen come through them.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast", "input_capture"] }
pollster = "0.4"
# The mouse and keyboard of this computer on their way to another one (InputCapture): the desktop hands them over through libei.
reis = "0.7"
futures-util = "0.3"
async-channel = "2"
enumflags2 = "0.7"
libc = "0.2"
