[package]
name = "tandem-windows"
version = "0.1.0"
description = "Tandem for Windows"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Marukiee/Tandem"
rust-version = "1.90"

[lib]
name = "tandem_windows_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tandem-core = { path = "../../crates/tandem-core" }
tandem-winsys = { path = "winsys" }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
anyhow = "1"
log = { version = "0.4", features = ["std"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
hostname = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
enigo = "0.6.1"
openh264 = { version = "0.9.8", optional = true }
jpeg-encoder = { version = "0.7", optional = true }
portable-pty = "0.9.0"
cpal = "0.15"

[dev-dependencies]
ring = "0.17"

# Its own workspace: the repository root only holds the crates of the core, and this one needs a webview toolchain
# that the other platforms' CI jobs should never have to build.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[features]
# A picture decoder of its own, for the systems whose web view cannot decode video (the one on Linux, mostly): the phone's screen and
# camera arrive as H.264, are decoded here and go on to the window as JPEG. Windows has the decoder in its web view.
native-video = ["dep:openh264", "dep:jpeg-encoder"]
# This computer as a screen that other devices can look at and use (host.rs). The encoder is OpenH264.
screen-host = ["dep:openh264"]
default = ["screen-host"]
