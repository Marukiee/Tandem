<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tandem</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/live.css" />
</head>
<body class="live">
  <canvas id="picture"></canvas>
  <div id="state" class="state"><div id="message"></div><button id="close" class="btn accent" hidden></button></div>
  <div id="top" class="top" data-tauri-drag-region>
    <div id="bar" class="bar" hidden>
      <button id="control" class="round" type="button" hidden></button>
      <button id="pin" class="round" type="button"></button>
      <button id="turn" class="round" type="button"></button>
      <button id="copy" class="round" type="button"></button>
      <button id="stop" class="round danger" type="button"></button>
    </div>
    <div id="chrome" class="chrome"></div>
  </div>
  <div id="help" class="help" hidden><div id="helptext"></div><button id="helpclose" class="btn small" type="button"></button></div>
  <div id="edges"></div>
  <script type="module" src="js/live.js"></script>
</body>
</html>
