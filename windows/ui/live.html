<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tandem</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/live.css" />
</head>
<body class="live">
  <canvas id="picture"></canvas>
  <div id="state" class="state"><div id="message"></div><button id="close" class="btn accent" hidden></button></div>
  <div id="bar" class="bar" hidden>
    <button id="pin" class="btn small"></button>
    <button id="turn" class="btn small"></button>
    <button id="copy" class="btn small"></button>
    <button id="stop" class="btn small danger"></button>
  </div>
  <script type="module" src="js/live.js"></script>
</body>
</html>
