[workspace]
resolver = "3"
members = ["crates/*"]
# The Windows app has its own workspace: it needs a webview toolchain the other platforms never build.
exclude = ["windows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Marukiee/Tandem"
rust-version = "1.90"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
