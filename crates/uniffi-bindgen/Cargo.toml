[package]
name = "uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/swift.rs"

[dependencies]
uniffi = { version = "0.32.2", features = ["cli"] }
