[package]
name = "tandem-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "tandem_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
ciborium = "0.2.2"
data-encoding = "2.11.1"
if-addrs = "0.15.0"
mdns-sd = "0.21.4"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tracing = "0.1.44"
uniffi = { version = "0.32.2", features = ["tokio"] }
x509-parser = "0.18.1"

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
