# Tandem Hub. Start with: docker compose up -d
services:
  tandem-hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    container_name: tandem-hub
    restart: unless-stopped
    # Host networking: devices find each other with mDNS on the LAN, and the hub has
    # to be reachable on the Tailscale interface of the host. Neither works from a
    # bridged container.
    network_mode: host
    stop_signal: SIGINT
    environment:
      TANDEM_NAME: ${TANDEM_NAME:-Tandem Hub}
    volumes:
      # Identity, circle and received files (in /data/inbox). To reach the files
      # directly, swap this for a bind mount (./data:/data) and run the container as
      # the owner of that folder with `user: "1000:1000"`.
      - tandem-data:/data

  # Optional, for push notifications later. Not used by Tandem yet.
  # ntfy:
  #   image: binwiederhier/ntfy
  #   command: serve
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ntfy-cache:/var/cache/ntfy

volumes:
  tandem-data:
  # ntfy-cache:
